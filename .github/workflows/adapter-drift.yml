name: RAD adapter drift

on:
  push:
    paths:
      - '.github/**'
      - '.rad/**'
      - 'tools/generate_adapters.py'
      - '.codex/**'
      - '.opencode/**'
      - '.claude/**'
      - '.cursor/**'
      - 'CLAUDE.md'
      - 'security/**'
      - 'scripts/**'
      - 'tests/security/**'
  pull_request:
    paths:
      - '.github/**'
      - '.rad/**'
      - 'tools/generate_adapters.py'
      - '.codex/**'
      - '.opencode/**'
      - '.claude/**'
      - '.cursor/**'
      - 'CLAUDE.md'
      - 'security/**'
      - 'scripts/**'
      - 'tests/security/**'

permissions:
  contents: read

jobs:
  check-adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify generated adapters are in sync
        run: python tools/generate_adapters.py --check --all
      - name: Fail if a workflow file is syntactically invalid YAML
        run: |
          python -m pip install --quiet PyYAML
          python -c "import glob, yaml; [yaml.safe_load(open(f, encoding='utf-8')) for f in glob.glob('.github/workflows/*.yml') + glob.glob('.github/workflows/*.yaml')]"

  portable-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run platform-neutral security regressions
        run: python -B -m unittest discover -s tests/security -v

  security-regression:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run security regressions on Windows (Job Objects, guard, broker)
        run: python -B -m unittest discover -s tests/security -v